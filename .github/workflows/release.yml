name: Release

# 由本地 `pnpm release`（bumpp）推上来的 v* tag 触发。
# workflow_dispatch 用同一个 job 重跑一个已存在的 tag，给漏掉 Release 的旧 tag 补发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要（重新）生成 Release 的已有 tag，例如 v1.1.0
        required: true

# 创建 Release 需要写权限；其余一律只读。
permissions:
  contents: write

env:
  # 被发布 tag 的唯一真值来源：推上来的 ref，补发时则是 dispatch 的输入。
  # run 步骤里读 $TAG，这样这个值永远不会被插值进 shell。
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 检出 tag 本身，这样 dispatch 补发时门禁跑的是**当时真正发布的那棵树**，
          # 而不是默认分支当前的 head。
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # changelogithub 靠完整历史找上一个 tag，浅克隆会得到空 changelog。
          fetch-depth: 0

      # 必须排在 setup-node 前面，否则 `cache: pnpm` 找不到 pnpm。
      # 装哪个版本由 package.json 的 packageManager 决定。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 防住写错的 tag：一个名叫 v1.2.0 的 Release，如果是从还写着 1.1.9 的树上切出来的，
      # 发出去的 release notes 指向的就是错的版本。
      - name: 校验 tag 与 package.json 的版本号一致
        run: |
          # dispatch 输入若漏了 v 前缀，会通过下面的版本比对，
          # 却让后续所有 tag 查找都指向一个不存在的 ref。
          case "$TAG" in
            v*) ;;
            *) echo "Tag $TAG must start with 'v', aborting"; exit 1 ;;
          esac
          PKG="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG, aborting"
            exit 1
          fi

      # 发版门禁：与本地 build:prod 相同的几条命令，一条一步地写开，这样失败时
      # 自己报出是哪一条。用 lint 而非 lint:fix——CI 里自动修复等于把门禁要拦的
      # 问题藏起来。绕过本地门禁推上来的 tag 也照样进不了 Release。
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # test:e2e 的 globalSetup 也会构建 dist/，但 build 保留成独立一步，
      # 这样构建失败会自报家门，而不是伪装成一个费解的 E2E 启动错误。
      - run: pnpm build
      - run: pnpm test:e2e

      # 把两个 tag 之间的提交按 conventional commits 渲染进 Release 正文。
      # 锁在大版本上：不锁的 dlx 会让上游的破坏性变更在最糟糕的时刻炸掉一次发版。
      - name: 生成 changelog 与 GitHub Release
        run: pnpm dlx changelogithub@15 --to "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
